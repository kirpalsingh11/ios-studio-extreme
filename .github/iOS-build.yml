name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_name:
        description: "App display name"
        required: false
        default: "iOS Studio Extreme"
      bundle_id:
        description: "Bundle identifier"
        required: false
        default: "com.developer.iosstudioextreme"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap copy ios
          npx cap sync ios

      - name: Patch bundle ID and app name
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'iOS Studio Extreme' }}"
          BUNDLE_ID="${{ github.event.inputs.bundle_id || 'com.developer.iosstudioextreme' }}"

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = [^;]*;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;|g" "$PBXPROJ"
          sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
          sed -i '' '/PROVISIONING_PROFILE/d' "$PBXPROJ"

          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$PLIST"

      - name: Build with Xcode (REAL binary)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            TARGETED_DEVICE_FAMILY="1,2" \
            clean archive

      - name: Verify real binary
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -1)
          BIN="$APP/App"
          echo "Binary type: $(file "$BIN")"
          echo "Binary size: $(stat -f%z "$BIN") bytes"
          otool -l "$BIN" | grep -A2 "segname __LINKEDIT" | head -5
          if [ $(stat -f%z "$BIN") -lt 10000 ]; then
            echo "ERROR: Binary is too small — not a real app"
            exit 1
          fi
          echo "✓ Real Mach-O binary confirmed"

      - name: Package .ipa
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry iOSStudioExtreme.ipa Payload
          shasum -a 256 iOSStudioExtreme.ipa > iOSStudioExtreme.ipa.sha256
          echo "✓ .ipa packaged:"
          unzip -l iOSStudioExtreme.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            iOSStudioExtreme.ipa
            iOSStudioExtreme.ipa.sha256
          retention-days: 30
