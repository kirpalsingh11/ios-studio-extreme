name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/ios@6 --save
          npx cap --version
          
      - name: Prepare www folder
        run: |
          mkdir -p www
          for f in index.html app.js styles.css manifest.json; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; fi
          done
          test -f www/index.html || { echo "ERROR: index.html missing"; exit 1; }

      - name: Add iOS platform
        run: npx cap add ios

      - name: Install pods and verify workspace
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..
          # .xcworkspace is a DIRECTORY, not a file — use -d
          test -d ios/App/App.xcworkspace || { echo "ERROR: workspace directory not found"; ls -la ios/App/; exit 1; }
          echo "Workspace ready"

      - name: Sync
        run: |
          npx cap copy ios
          npx cap sync ios

      - name: Set app icon
        run: |
          if [ -f "app-icon.png" ]; then
            ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$ICON_DIR"
            cat > "$ICON_DIR/Contents.json" << 'ICONEND'
          {"images":[{"size":"1024x1024","idiom":"universal","platform":"ios","filename":"icon-1024.png"}],"info":{"version":1,"author":"xcode"}}
          ICONEND
            sips -z 1024 1024 app-icon.png --out "$ICON_DIR/icon-1024.png"
          fi

      - name: Patch config
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = [^;]*;|PRODUCT_BUNDLE_IDENTIFIER = com.developer.iosstudioextreme;|g" "$PBXPROJ"
          sed -i '' "/CODE_SIGN_IDENTITY/d" "$PBXPROJ"
          sed -i '' "/CODE_SIGN_STYLE/d" "$PBXPROJ"
          sed -i '' "/DEVELOPMENT_TEAM/d" "$PBXPROJ"
          sed -i '' "/PROVISIONING_PROFILE/d" "$PBXPROJ"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName iOS Studio Extreme" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.developer.iosstudioextreme" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$PLIST"

      - name: Build
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE="" \
            ENABLE_BITCODE=NO IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            TARGETED_DEVICE_FAMILY="1,2" \
            clean archive 2>&1 | tee build.log
          test -d build/App.xcarchive || { grep "error:" build.log | head -20; exit 1; }

      - name: Package IPA
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry iOSStudioExtreme.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: iOSStudioExtreme.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: iOSStudioExtreme.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Real compiled iOS app. Sign with ESign + free Apple ID."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
